server {
    listen 8443 ssl;
    server_name epss.empiricalsecurity.com;

    absolute_redirect off;
    port_in_redirect off;

    ssl_certificate     /etc/nginx/certs/epss/public-key.pem;
    ssl_certificate_key /etc/nginx/certs/epss/private-key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html/epss;

    # Redirection uniquement sur la racine /
    location = / {
        return 302 /__CURRENT_EPSS_SCORES_FILE__;
    }

    location / {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
    }
}